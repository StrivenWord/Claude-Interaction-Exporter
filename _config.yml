title: Claude Conversation Exporter
description: A browser extension for exporting Claude conversations
baseurl: ""
url: "https://strivenword.github.io/Claude-Interaction-Exporter"

remote_theme: mmistakes/minimal-mistakes-jekyll

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

exclude:
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
