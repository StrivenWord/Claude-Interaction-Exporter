title: Claude Interaction Exporter
name: Claude Interaction Exporter
description: A browser extension for exporting your Claude.ai conversations, Cowork sessions, and scheduled tasks
url: "https://strivenword.github.io"
baseurl: "/Claude-Interaction-Exporter"
repository: "StrivenWord/Claude-Interaction-Exporter"
locale: "en-US"

theme: minimal-mistakes-jekyll
minimal_mistakes_skin: "contrast"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

author:
  name: "Paul Lee"
  bio: "Building tools for exporting and archiving Claude.ai conversations."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/StrivenWord/Claude-Interaction-Exporter"

footer:
  ai_notice: "Text content on this site was authored using AI, with human direction and editorial review."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/StrivenWord/Claude-Interaction-Exporter"
    - label: "Report an Issue"
      icon: "fas fa-fw fa-bug"
      url: "https://github.com/StrivenWord/Claude-Interaction-Exporter/issues"

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
      toc: true
      toc_sticky: true

exclude:
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
